[env:switch_esp8266]
platform = espressif8266
board = esp12e
framework = arduino
upload_speed = 921600
monitor_speed = 74880
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld

extra_scripts = pre:scripts/build_env.py

build_src_filter =
    +<*>
    -<profiles/pump>
    -<profiles/remote_switch>

build_flags =
    -DPROFILE_SWITCH=1
    -DWEBSOCKETS_SERVER_CLIENT_MAX=2

    # Linker flags
    -std=gnu++14
    -Wl,-Map,.pio/build/switch_esp8266/firmware.map
    -Wno-sign-compare
    -Wno-switch
    -Wno-format-truncation


[env:remote_switch_esp8266]
platform = espressif8266
board = esp12e
framework = arduino
